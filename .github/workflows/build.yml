name: Calidad SonarQube y pruebas
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  tests-and-sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Instalar dependencias de CI
        run: python -m pip install -r requirements-ci.txt
      - name: Pruebas y cobertura
        run: python -m pytest -q tests --cov=mlops_pipeline --cov-report=xml:coverage.xml --junitxml=junit.xml
      - name: Analizar calidad del código
        uses: SonarSource/sonarqube-scan-action@v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
